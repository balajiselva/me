id: aiostreams
name: AIOStreams
description: "Stable multi-provider Prowlarr indexer for AIOStreams (Debrid + Torrent compatible)"
language: en-US
type: public
encoding: UTF-8
followredirect: false
testlinktorrent: false
requestDelay: 5

links:
  - http://aiostreams:3000

caps:
  categories:
    Movies: Movies
    TV: TV
  modes:
    search: [q]
    movie-search: [q, imdbid]
    tv-search: [q, imdbid, season, ep]
  allowrawsearch: false

settings:
  - name: info
    type: info
    label: Base64 config
    default: "Complete your configuration and copy the generated link.<br/> Paste the link into your browser to find your code eg. http://localhost:3000/stremio/uuid/base64_string/manifest.json."

  - name: uuid
    type: text
    label: UUID
    default: ""

  - name: b64config
    type: text
    label: Base64 Encoded Configuration
    default: ""

  - name: validate_imdb_movie
    type: text
    label: IMDB ID of Movie to use for Radarr validation
    default: "tt0137523"

  - name: validate_imdb_tv
    type: text
    label: IMDB ID TV show to use for Sonarr validation
    default: "tt9288030"

search:
  headers:
    User-Agent:
      - "AIOStreams/1.0"

  paths:
    - path: /stremio/{{ .Config.uuid }}/{{ .Config.b64config }}/stream/movie/{{ if .Query.IMDBID }}{{ .Query.IMDBID }}{{ else }}{{ .Config.validate_imdb_movie }}{{ end }}.json
      method: get
      response:
        type: json
        noResultsMessage: '"streams": []'
      categories: [Movies]

    - path: /stremio/{{ .Config.uuid }}/{{ .Config.b64config }}/stream/series/{{ if .Query.IMDBID }}{{ .Query.IMDBID }}{{ else }}{{ .Config.validate_imdb_tv }}{{ end }}:{{ if .Query.Season }}{{ .Query.Season }}{{ else }}1{{ end }}:{{ if .Query.Ep }}{{ .Query.Ep }}{{ else }}1{{ end }}.json
      method: get
      response:
        type: json
        noResultsMessage: '"streams": []'
      categories: [TV]

  rows:
    selector: streams
    missingAttributeEqualsNoResults: true

  fields:

    # -------------------------
    # TITLE (SAFE + FALLBACK)
    # -------------------------

    parsed_title:
      selector: streamData.parsedFile.title
      optional: true
      filters:
        - name: trim

    filename_title:
      selector: behaviorHints.filename
      optional: true
      filters:
        - name: trim

    title:
      text: >
        {{ if .Result.parsed_title }}
          {{ .Result.parsed_title }}
        {{ else if .Result.filename_title }}
          {{ .Result.filename_title }}
        {{ else }}
          Unknown Title
        {{ end }}

    # -------------------------
    # YEAR
    # -------------------------

    parsed_year:
      selector: streamData.parsedFile.year
      optional: true

    year_fallback:
      selector: description
      optional: true
      filters:
        - name: regexp
          args: "(\\b(19|20)\\d{2}\\b)"

    year:
      text: >
        {{ if .Result.parsed_year }}
          {{ .Result.parsed_year }}
        {{ else if .Result.year_fallback }}
          {{ .Result.year_fallback }}
        {{ else }}
          0000
        {{ end }}

    # -------------------------
    # CATEGORY
    # -------------------------

    category_is_tv_show:
      selector: streamData.parsedFile.season
      optional: true

    category:
      text: "{{ if .Result.category_is_tv_show }}TV{{ else }}Movies{{ end }}"

    # -------------------------
    # INFOHASH (TORRENT SAFE)
    # -------------------------

    infohash:
      selector: streamData.torrent.infoHash
      optional: true
      filters:
        - name: trim
        - name: regexp
          args: "([A-Fa-f0-9]{40})"

    # -------------------------
    # SIZE
    # -------------------------

    parsed_size:
      selector: streamData.size
      optional: true

    size_fallback:
      selector: behaviorHints.videoSize
      optional: true

    size_description:
      selector: description
      optional: true
      filters:
        - name: regexp
          args: "\\b(\\d+(?:\\.\\d+)? [MG]B)\\b"

    size:
      text: >
        {{ if .Result.parsed_size }}
          {{ .Result.parsed_size }}
        {{ else if .Result.size_fallback }}
          {{ .Result.size_fallback }}
        {{ else if .Result.size_description }}
          {{ .Result.size_description }}
        {{ else }}
          0
        {{ end }}

    # -------------------------
    # QUALITY
    # -------------------------

    parsed_quality:
      selector: streamData.parsedFile.quality
      optional: true

    quality_fallback:
      selector: name
      optional: true
      filters:
        - name: regexp
          args: "\\b2160p|1080p|720p|480p\\b"

    quality:
      text: >
        {{ if .Result.parsed_quality }}
          {{ .Result.parsed_quality }}
        {{ else if .Result.quality_fallback }}
          {{ .Result.quality_fallback }}
        {{ else }}
          Unknown
        {{ end }}

    # -------------------------
    # PROVIDER META
    # -------------------------

    indexer:
      selector: streamData.indexer
      optional: true

    source:
      selector: streamData.addon
      optional: true

    # -------------------------
    # STATIC FIELDS (REQUIRED BY PROWLARR)
    # -------------------------

    date:
      text: "2024-01-01"

    seeders:
      text: "30"

    leechers:
      text: "0"
